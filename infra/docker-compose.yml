# Entorno local: PostgreSQL + Mailpit (bandeja de correo falsa para probar notificaciones)
# Nombre fijo: en Docker Desktop aparece como "reservaitn" (si no, tomaría el nombre de la carpeta, "infra")
name: reservaitn
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reservaitn
      POSTGRES_PASSWORD: reservaitn
      POSTGRES_DB: reservaitn
    # Puerto 5434 en el computador (no el 5432 habitual): en Windows es común tener un PostgreSQL
    # instalado ocupando el 5432, y además gana la conexión a localhost aunque Docker también lo publique.
    # Si el 5434 también está ocupado, definir DB_PUERTO (ver docs/00-guia-de-inicio.md, paso 4).
    ports: ["${DB_PUERTO:-5434}:5432"]
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservaitn"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]
volumes:
  db_data:
