name: Historia de usuario
description: Funcionalidad nueva vinculada a un requisito y paquete de la EDT
labels: ["historia"]
body:
  - type: input
    id: historia
    attributes:
      label: Historia
      placeholder: Como <rol> quiero <acción> para <beneficio>
    validations: { required: true }
  - type: input
    id: edt
    attributes:
      label: Paquete EDT
      placeholder: "1.4.4"
    validations: { required: true }
  - type: input
    id: requisito
    attributes:
      label: Requisito(s)
      placeholder: "R1, R4"
    validations: { required: true }
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad (MoSCoW)
      options: [Debe, Debería, Podría]
    validations: { required: true }
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      value: |
        - Dado ... cuando ... entonces ...
    validations: { required: true }
  - type: dropdown
    id: estimacion
    attributes:
      label: Estimación
      options: ["½ día", "1 día", "2 días (máximo; si es más, dividir)"]
