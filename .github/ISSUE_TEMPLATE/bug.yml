name: Bug
description: Algo no funciona como dice el criterio de aceptación
labels: ["bug"]
body:
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      description: "Crítico = impide reservar o permite una reserva doble"
      options: [Crítico, Alto, Medio, Bajo]
    validations: { required: true }
  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma
      multiple: true
      options: [Web, Android, iOS, API]
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado vs. obtenido
    validations: { required: true }
  - type: input
    id: usuario
    attributes:
      label: Rol del usuario con que se probó
